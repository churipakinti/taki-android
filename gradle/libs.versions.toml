[versions]
# You need to run ./gradlew wrapper after updating the version
gradle                 = "9.4.1"

navigation             = "2.9.7"
gradlePlugin           = "9.1.0"
androidxcar            = "1.7.0"
androidxcore           = "1.18.0"
androidxTestCore       = "1.7.0"
ktlint                 = "1.8.0"
ktlintGradle           = "14.2.0"
detekt                 = "1.23.8"
preferences            = "1.2.1"
media3                 = "1.9.3"

materialDesign         = "1.13.0"
constraintLayout       = "2.2.1"
multidex               = "2.0.1"
room                   = "2.8.4"
kotlin                 = "2.3.20"
ksp                    = "2.3.6"
kotlinxCoroutines      = "1.10.2"
viewModelKtx           = "2.10.0"
swipeRefresh           = "1.2.0"
documentfile           = "1.1.0"

retrofit               = "3.0.0"
jackson                = "2.21.1"
okhttp                 = "5.3.2"
koin                   = "4.2.0"
coil                   = "3.4.0"

junit4                 = "4.13.2"
junit                  = "6.0.3"
mockito                = "5.23.0"
mockitoKotlin          = "6.2.3"
kluent                 = "1.73"
apacheCodecs           = "1.21.0"
