name: CI

on:
  push:
    branches: [develop, "release/**"]
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Restore and validate debug signing keystore
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
          EXPECTED_DEBUG_CERT_SHA256: "03:A1:50:8C:81:16:5B:E8:CE:88:9C:C3:BD:70:09:DC:40:B7:9F:EB:E8:62:F9:A7:0A:B9:5E:46:90:25:8E:1E"
        run: |
          set -euo pipefail

          # On the hosted runner AGP resolves the default debug keystore via
          # XDG_CONFIG_HOME (~/.config/.android), not ~/.android. Pin ANDROID_USER_HOME
          # for every later step so the restored keystore is the one Gradle uses.
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.android"
          KS="$HOME/.android/debug.keystore"

          # Decode the secret. base64 without --ignore-garbage fails loudly on a
          # malformed value instead of writing a file AGP would silently replace.
          printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > "$KS"

          # 1. non-empty
          if [ ! -s "$KS" ]; then
            echo "::error::Decoded debug keystore is missing or empty"
            exit 1
          fi

          # 2. byte size
          SIZE=$(wc -c < "$KS" | tr -d '[:space:]')
          echo "Decoded debug keystore size: ${SIZE} bytes"

          # 3. read the entry (output captured, never printed)
          if ! KEYTOOL_OUT=$(keytool -list -v \
              -keystore "$KS" \
              -alias androiddebugkey \
              -storepass android 2>&1); then
            echo "::error::keytool could not read the decoded debug keystore with alias 'androiddebugkey'"
            exit 1
          fi

          # 4. extract only the certificate SHA-256 fingerprint
          FP=$(printf '%s\n' "$KEYTOOL_OUT" \
            | grep -E 'SHA-?256:' \
            | head -n1 \
            | sed -E 's/.*SHA-?256:[[:space:]]*//' \
            | tr -d '[:space:]')
          echo "keytool certificate SHA-256: ${FP:-<none>}"

          # 5. fail unless it matches the known local debug keystore
          if [ "$FP" != "$EXPECTED_DEBUG_CERT_SHA256" ]; then
            echo "::error::Debug keystore certificate does not match the expected fingerprint"
            exit 1
          fi
          echo "keytool check passed"

      - name: Verify debug signing via Gradle signingReport
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          EXPECTED_DEBUG_CERT_SHA256: "03:A1:50:8C:81:16:5B:E8:CE:88:9C:C3:BD:70:09:DC:40:B7:9F:EB:E8:62:F9:A7:0A:B9:5E:46:90:25:8E:1E"
        run: |
          set -euo pipefail
          ./gradlew :ultrasonic:signingReport --no-daemon > signing-report.txt

          # Isolate the 'debug' variant stanza (exact match, not debugAndroidTest etc.)
          STANZA=$(sed -n '/^Variant: debug$/,/^$/p' signing-report.txt)
          if [ -z "$STANZA" ]; then
            echo "::error::signingReport produced no 'debug' variant stanza"
            exit 1
          fi

          STORE=$(printf '%s\n' "$STANZA" | sed -n -E 's/^[[:space:]]*Store:[[:space:]]*//p' | head -n1)
          # Match any SHA-256-shaped 32-byte colon-hex string, independent of the label.
          GRADLE_FP=$(printf '%s\n' "$STANZA" | grep -ioE '([0-9A-F]{2}:){31}[0-9A-F]{2}' | head -n1 | tr 'a-f' 'A-F')
          echo "signingReport debug Store: ${STORE:-<none>}"
          echo "signingReport debug SHA-256: ${GRADLE_FP:-<none>}"

          if [ "$STORE" != "$HOME/.android/debug.keystore" ]; then
            echo "::error::debug variant does not point at $HOME/.android/debug.keystore"
            exit 1
          fi
          if [ "$GRADLE_FP" != "$EXPECTED_DEBUG_CERT_SHA256" ]; then
            echo "::error::signingReport debug fingerprint does not match the expected value"
            exit 1
          fi
          rm -f signing-report.txt
          echo "signingReport check passed"

      - name: Test, lint, and build
        run: ./gradlew testDebugUnitTest lint assembleDebug assembleRelease --no-daemon

      - name: Upload debug APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: taki-debug-${{ github.sha }}
          path: ultrasonic/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
