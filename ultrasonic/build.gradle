plugins {
    alias libs.plugins.ksp
}

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: "androidx.navigation.safeargs.kotlin"
apply from: "../gradle_scripts/code_quality.gradle"

// Taki's own release signing identity (TAKI_BETA_COMPLETION_PLAN.md P0.1) -- deliberately
// NOT the legacy ultrasonic-keystore.enc, which must never become Taki's signing identity.
// keystore.properties is gitignored and lives only on machines that build a release; see
// docs/RELEASE_SIGNING.md for the variable names and regeneration procedure (never the values).
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} else {
    logger.warn(
            "keystore.properties not found at ${keystorePropertiesFile} -- assembleRelease " +
                    "will produce an UNSIGNED apk. See docs/RELEASE_SIGNING.md."
    )
}

android {
    compileSdkVersion versions.compileSdk

    defaultConfig {
        // Taki's own installable identity (docs/TAKI_FINAL_PRE_BETA_CONSOLIDATION_PLAN.md Phase
        // 2) -- deliberately not org.moire.ultrasonic, the upstream project's id. The Kotlin
        // namespace below intentionally stays org.moire.ultrasonic; only the installable id
        // changes. Existing installs under the old id (including test devices) cannot update in
        // place and need a clean reinstall.
        applicationId "io.github.churipakinti.taki"
        versionCode 131
        versionName "0.1.0-beta"

        minSdkVersion versions.minSdk
        targetSdkVersion versions.targetSdk
        resourceConfigurations += ['cs', 'de', 'en', 'es', 'fr', 'gl', 'hu', 'it', 'ja', 'nb-rNO', 'nl', 'pl', 'pt', 'pt-rBR', 'ru', 'zh-rCN', 'zh-rTW']
    }

    bundle.language.enableSplit = false

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources = true
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'minify/proguard-main.pro',
                    'minify/proguard-okhttp.pro',
                    'minify/proguard-retrofit.pro',
                    'minify/proguard-jackson.pro',
                    'minify/proguard-kotlin-reflect.pro',
                    'minify/proguard-kotlin.pro',
                    'minify/proguard-coil.pro'
        }
        debug {
            minifyEnabled = false
            multiDexEnabled = true
            applicationIdSuffix = '.debug'
            enableUnitTestCoverage = true
            enableAndroidTestCoverage = true
            resValue "string", "common.appname", "Taki (Debug)"
        }
    }

    sourceSets {
        main.java.srcDirs += "${projectDir}/src/main/kotlin"
        test.java.srcDirs += "${projectDir}/src/test/kotlin"
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE']
        }
    }

    kotlin {
        jvmToolchain {
            languageVersion.set(JavaLanguageVersion.of(25))
        }
    }

    buildFeatures {
        viewBinding = true
        dataBinding = true
        buildConfig = true
        resValues = true
    }

    ksp {
        arg("room.schemaLocation", "$rootDir/ultrasonic/schemas")
    }

    lint {
        baseline = file("lint-baseline.xml")
        abortOnError = true
        warningsAsErrors = true
        warning 'ImpliedQuantity'
        disable 'IconMissingDensityFolder', 'VectorPath'
        disable 'MissingTranslation', 'UnusedQuantity', 'MissingQuantity'
        disable 'ObsoleteLintCustomCheck'
        // We manage dependencies on Gitlab with RenovateBot
        disable 'GradleDependency'
        disable 'NewerVersionAvailable'
        disable 'AndroidGradlePluginVersion'
        textReport = true
        checkDependencies = true
    }
    namespace = 'org.moire.ultrasonic'

}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            output.outputFileName.set(
                    "Taki-${output.versionName.get()}-${variant.buildType}.apk"
            )
        }
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

