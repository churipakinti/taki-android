# Robolectric config for every unit test in this module.
#
# sdk: the app compiles/targets a very new platform (compileSdk / targetSdk 37). With
# `testOptions.unitTests.includeAndroidResources` enabled (issue #9, needed for the Compose
# UI / Roborazzi / navigation-graph tests) Robolectric reads that target from the merged
# manifest and rejects it as unsupported, so pin to a supported, deterministic platform.
#
# application: keep the module's real `UApp` from becoming the test Application. `UApp` starts
# Koin and calls a StrictMode method Robolectric does not implement; before resources were
# enabled it was simply never picked up. Tests that need `UApp.applicationContext()` still
# install a stand-in via `RobolectricUAppContext`.
sdk=35
application=android.app.Application
